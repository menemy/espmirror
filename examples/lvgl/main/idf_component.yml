dependencies:
  menemy/espmirror:
    version: "*"
    override_path: "../../.."
  lvgl/lvgl: "^9.5"
  espressif/esp_codec_dev: "^1.3"
  espressif/esp_lcd_co5300:
    version: "2.2.0"
    rules:
      - if: '$CONFIG{EXAMPLE_BOARD_ID} in ["waveshare_216", "waveshare_175c"]'
  espressif/esp_lcd_touch_cst9220:
    version: "0.1.1"
    rules:
      - if: '$CONFIG{EXAMPLE_BOARD_ID} == "waveshare_216"'
  waveshare/esp_lcd_touch_cst9217:
    version: "2.0.0"
    rules:
      - if: '$CONFIG{EXAMPLE_BOARD_ID} == "waveshare_175c"'
  espressif/esp_lcd_touch:
    version: "^1.2.0"
    rules:
      - if: '$CONFIG{EXAMPLE_BOARD_ID} in ["waveshare_175c", "waveshare_p4_35"]'
  espressif/esp_lcd_axs15231b:
    version: "2.1.1"
    rules:
      - if: '$CONFIG{EXAMPLE_BOARD_ID} == "waveshare_349"'
  espressif/esp_lcd_st7796:
    version: "^1"
    rules:
      - if: '$CONFIG{EXAMPLE_BOARD_ID} == "waveshare_p4_35"'
  espressif/esp_lcd_touch_ft5x06:
    version: "^1"
    rules:
      - if: '$CONFIG{EXAMPLE_BOARD_ID} == "waveshare_p4_35"'
  espressif/esp_tinyusb:
    version: "^2.4.0"
    rules:
      - if: '$CONFIG{EXAMPLE_BOARD_ID} == "waveshare_p4_35"'
