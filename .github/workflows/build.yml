name: build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  examples:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        idf: ["v5.1", "v5.4", "v6.0"]
        example: [basic, lvgl]
        target: [esp32s3, esp32]
        exclude:
          # The registry's LVGL manifest needs component manager 2 (ESP-IDF 5.4+).
          - idf: "v5.1"
            example: lvgl
        include:
          - idf: "v5.4"
            example: virtual
            target: esp32s3
          - idf: "v6.0.1"
            example: virtual
            target: esp32s3
          # Its own job: an include merges only into the original matrix combinations.
          - idf: "v6.0.1"
            example: virtual
            target: esp32s3
            defaults: "sdkconfig.defaults;sdkconfig.usbnet"
          - idf: "v6.0.1"
            example: virtual
            target: esp32s3
            defaults: "sdkconfig.defaults;sdkconfig.mosaico"
    steps:
      - uses: actions/checkout@v5
      - name: Build ${{ matrix.example }} for ${{ matrix.target }} on ESP-IDF ${{ matrix.idf }}
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: ${{ matrix.idf }}
          target: ${{ matrix.target }}
          path: examples/${{ matrix.example }}
          command: idf.py ${{ matrix.defaults && format('-D SDKCONFIG_DEFAULTS="{0}"', matrix.defaults) || '' }} build

  viewer:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m py_compile tools/espmirror.py tools/fake_board.py
      - run: python -m pip install -r tools/requirements.txt
      - run: python -m unittest discover -s tests -p 'test_*.py'
        env:
          QT_QPA_PLATFORM: offscreen
